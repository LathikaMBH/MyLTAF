version: 2.1  # Adjust if needed based on CircleCI version
jobs:
  run-LTAF:
    docker:
      - image: cypress/browsers:node-22.11.0-chrome-130.0.6723.69-1-ff-132.0-edge-130.0.2849.56-1
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Run Cypress tests
          command: npx cypress run
workflows:
  run-test:  # You can rename this workflow section if needed
    jobs:
      - run-LTAF
